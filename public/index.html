<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WhisperConnect+ - A sleek, realtime chat application powered by Node.js and Socket.IO" />
  <title>WhisperConnect+ 💬 | Realtime Modern Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="app-container">
    <!-- Join Chat Screen -->
    <div id="username-section" class="card join-card">
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span>Real-time Chat</span>
      </div>
      <h1 class="brand-title">WhisperConnect<span class="brand-accent">+</span> 💬</h1>
      <p class="brand-subtitle">Fast, lightweight, and end-to-end connected room.</p>

      <form id="username-form" class="join-form">
        <div class="avatar-preview" id="avatar-preview">
          <span id="avatar-letter">?</span>
        </div>
        <div class="input-group">
          <label for="username">Your Nickname</label>
          <input 
            id="username" 
            type="text" 
            maxlength="20" 
            placeholder="e.g. Alex, SkyWalker..." 
            autocomplete="off" 
            required 
            autofocus
          />
        </div>
        <button type="submit" id="join-btn" class="btn btn-primary">
          <span>Join Room</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="connection-status-pill" id="login-status">
        <span class="status-indicator"></span>
        <span id="login-status-text">Connecting to server...</span>
      </div>
    </div>

    <!-- Chat Active Screen -->
    <div id="chat-section" class="card chat-card" style="display: none;">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="chat-header-left">
          <div class="header-avatar" id="header-user-avatar">?</div>
          <div>
            <div class="header-title-row">
              <h2>WhisperConnect<span class="brand-accent">+</span></h2>
              <span class="status-chip" id="connection-status-chip">
                <span class="chip-dot"></span>
                <span id="status-label">Live</span>
              </span>
            </div>
            <div class="header-user-info">
              <span>Logged in as <strong id="current-user-name">User</strong></span>
              <span class="divider">•</span>
              <span class="online-counter" id="online-count">👥 1 online</span>
            </div>
          </div>
        </div>
        <div class="chat-header-actions">
          <button id="sound-toggle-btn" class="icon-btn" title="Toggle message sound" aria-label="Toggle sound">
            <span id="sound-icon">🔔</span>
          </button>
          <button id="leave-btn" class="icon-btn leave-btn" title="Leave room" aria-label="Leave chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat Messages Body -->
      <div class="messages-container" id="messages-container">
        <div class="room-welcome">
          <div class="welcome-icon">💬</div>
          <h3>Welcome to the room!</h3>
          <p>Messages are delivered in real time across all connected browsers.</p>
        </div>
        <ul id="messages" class="messages-list"></ul>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="typing-indicator" style="display: none;">
        <span class="typing-dots">
          <span></span><span></span><span></span>
        </span>
        <span id="typing-text">Someone is typing...</span>
      </div>

      <!-- Quick Reaction Emojis -->
      <div class="quick-reactions">
        <button type="button" class="reaction-btn" data-emoji="👍">👍</button>
        <button type="button" class="reaction-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="reaction-btn" data-emoji="🔥">🔥</button>
        <button type="button" class="reaction-btn" data-emoji="😂">😂</button>
        <button type="button" class="reaction-btn" data-emoji="🎉">🎉</button>
        <button type="button" class="reaction-btn" data-emoji="👋">👋</button>
      </div>

      <!-- Message Input Form -->
      <form id="form" class="chat-input-form">
        <div class="input-wrapper">
          <input 
            id="input" 
            autocomplete="off" 
            placeholder="Type your message..." 
            maxlength="500"
          />
        </div>
        <button type="submit" id="send-btn" class="btn btn-send" aria-label="Send message">
          <span>Send</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
